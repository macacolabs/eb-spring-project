name: Build and Deploy Spring Boot to AWS

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: myapp-dev-spring-api

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Set YML
        env:
          APPLICATION_DEV_YML: ${{ secrets.APPLICATION_DEV_YML }}
        run: |
          mkdir -p src/main/resources
          echo "$APPLICATION_DEV_YML" | base64 --decode > src/main/resources/application-dev.yml

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      # AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker 이미지 빌드 + ECR Push
      - name: Build and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # Elastic Beanstalk이 ECR 이미지를 Pull하도록 Dockerrun 생성
      - name: Create Dockerrun.aws.json
        run: |
          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "$IMAGE_URI",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "8080"
              }
            ]
          }
          EOF

      - name: Zip for deployment
        run: zip app.zip Dockerrun.aws.json

      # Dockerrun 배포 번들을 S3에 업로드하고 EB 버전 생성
      - name: Upload to S3 and Deploy to Elastic Beanstalk
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          EB_APP_NAME: ${{ secrets.EB_APP_NAME }}
          EB_ENV_NAME: ${{ secrets.EB_ENV_NAME }}
        run: |
          VERSION_LABEL=v${{ github.run_number }}-${{ github.run_attempt }}
          S3_KEY=deploy/$VERSION_LABEL.zip

          aws s3 cp app.zip "s3://$S3_BUCKET_NAME/$S3_KEY"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=$S3_BUCKET_NAME,S3Key=$S3_KEY"

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV_NAME" \
            --version-label "$VERSION_LABEL"